      - name: Test Python imports
        run: |
          python - <<'PY'
          import sys
          import importlib.metadata as md

          print("=" * 70)
          print("SERVER TEST")
          print("=" * 70)

          print("Python:", sys.version)

          packages = [
              "aiohttp",
              "httpx",
              "httpcore",
              "pyee",
              "ffmpy",
              "websockets_proxy",
              "betterproto",
              "mashumaro",
              "protobuf",
              "protobuf3-to-dict",
              "EulerApiSdk",
              "TikTokLive",
              "python-dateutil",
              "grpclib",
              "h2",
              "hyperframe",
              "hpack",
          ]

          print("\nINSTALLED VERSIONS")
          print("-" * 70)

          for package in packages:
              try:
                  print(
                      f"{package}: {md.version(package)}"
                  )
              except Exception as e:
                  print(
                      f"{package}: ERROR - {e}"
                  )

          print("\nIMPORT TESTS")
          print("-" * 70)

          import aiohttp
          print("[OK] aiohttp")

          import httpx
          print("[OK] httpx")

          import pyee
          print("[OK] pyee")

          import ffmpy
          print("[OK] ffmpy")

          import websockets_proxy
          print("[OK] websockets_proxy")

          import betterproto
          print("[OK] betterproto")

          import mashumaro
          print("[OK] mashumaro")

          import protobuf3_to_dict
          print("[OK] protobuf3_to_dict")

          import grpclib
          print("[OK] grpclib")

          import EulerApiSdk
          print("[OK] EulerApiSdk")

          import TikTokLive
          print("[OK] TikTokLive")

          import server
          print("[OK] server.py")

          print(
              "\nTIKTOK_AVAILABLE:",
              getattr(server, "TIKTOK_AVAILABLE", "NOT DEFINED")
          )

          if not getattr(server, "TIKTOK_AVAILABLE", False):
              raise RuntimeError(
                  "TikTokLive import server.py içinde başarısız"
              )

          print("\n" + "=" * 70)
          print("ALL PYTHON TESTS PASSED")
          print("=" * 70)
          PY
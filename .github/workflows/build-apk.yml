name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-22.04

    timeout-minutes: 60

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # PYTHON
      # ========================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ========================================================
      # JAVA
      # ========================================================

      - name: Setup Java
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: "17"


      # ========================================================
      # SYSTEM
      # ========================================================

      - name: Install system packages
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5


      # ========================================================
      # BUILDOZER
      # ========================================================

      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer \
            cython==0.29.36 \
            virtualenv


      # ========================================================
      # VERIFY VERSIONS
      # ========================================================

      - name: Verify Python packages
        run: |

          python -m pip install \
            "TikTokLive==6.6.5" \
            "EulerApiSdk==0.0.3"

          python - <<'PY'

          import sys
          import importlib.metadata as metadata

          print("=" * 70)
          print("PYTHON")
          print("=" * 70)

          print(sys.version)

          print()
          print(
              "TikTokLive:",
              metadata.version("TikTokLive")
          )

          print(
              "EulerApiSdk:",
              metadata.version("EulerApiSdk")
          )

          print(
              "TikTokLiveProto:",
              metadata.version("TikTokLiveProto")
          )

          print(
              "betterproto2:",
              metadata.version("betterproto2")
          )

          print("=" * 70)

          PY


      # ========================================================
      # TEST EULER COMPATIBILITY
      # ========================================================

      - name: Test Euler compatibility
        run: |

          python - <<'PY'

          from EulerApiSdk.api.tik_tok_live import (
              sign_webcast_url
          )

          print("=" * 70)
          print("Euler compatibility test")
          print("=" * 70)

          print(
              "sign_webcast_url:",
              sign_webcast_url
          )

          print(
              "module:",
              sign_webcast_url.__name__
          )

          print("=" * 70)
          print("EULER COMPATIBILITY OK")
          print("=" * 70)

          PY


      # ========================================================
      # TEST TIKTOKLIVE
      # ========================================================

      - name: Test TikTokLive import
        run: |

          python - <<'PY'

          import inspect

          from TikTokLive import TikTokLiveClient

          from TikTokLive.events import (
              ConnectEvent,
              DisconnectEvent,
              GiftEvent,
              LikeEvent,
              FollowEvent,
              ShareEvent,
              CommentEvent,
          )

          print("=" * 70)
          print("TikTokLive import test")
          print("=" * 70)

          print(
              "Client:",
              TikTokLiveClient
          )

          print(
              "Signature:",
              inspect.signature(
                  TikTokLiveClient
              )
          )

          print(
              "ConnectEvent:",
              ConnectEvent
          )

          print(
              "GiftEvent:",
              GiftEvent
          )

          print(
              "LikeEvent:",
              LikeEvent
          )

          print(
              "FollowEvent:",
              FollowEvent
          )

          print("=" * 70)
          print("TIKTOKLIVE IMPORT OK")
          print("=" * 70)

          PY


      # ========================================================
      # TEST SERVER
      # ========================================================

      - name: Test server import
        run: |

          python - <<'PY'

          import server

          print("=" * 70)
          print("SERVER TEST")
          print("=" * 70)

          print(
              "TikTokLive available:",
              server.TIKTOK_AVAILABLE
          )

          if not server.TIKTOK_AVAILABLE:
              raise SystemExit(
                  "TikTokLive import failed"
              )

          print("=" * 70)
          print("SERVER IMPORT OK")
          print("=" * 70)

          PY


      # ========================================================
      # BUILDOZER
      # ========================================================

      - name: Build APK
        run: |

          yes | buildozer android debug


      # ========================================================
      # FIND APK
      # ========================================================

      - name: Find APK
        id: find_apk
        shell: bash

        run: |

          APK_PATH="$(find bin -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then

            echo "APK bulunamadı."

            find bin -type f || true

            exit 1

          fi

          echo "APK:"
          echo "$APK_PATH"

          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"


      # ========================================================
      # UPLOAD
      # ========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: futbolgiftyarisi-apk

          path: ${{ steps.find_apk.outputs.path }}
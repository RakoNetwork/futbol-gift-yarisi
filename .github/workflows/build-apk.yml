name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # SOURCE
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'


      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            python3-pip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential


      # ============================================================
      # BUILDOZER
      # ============================================================

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer \
            cython==0.29.36 \
            virtualenv


      # ============================================================
      # TIKTOKLIVE + EULER API SDK
      # ============================================================

      - name: Install TikTokLive and EulerApiSdk
        run: |
          python -m pip install \
            TikTokLive==6.6.5 \
            EulerApiSdk==0.1.1


      # ============================================================
      # CHECK PYTHON PACKAGES
      # ============================================================

      - name: Check installed versions
        run: |
          python - <<'PY'
          import sys
          import TikTokLive
          import EulerApiSdk

          print("=" * 70)
          print("PYTHON")
          print("=" * 70)

          print("Python:")
          print(sys.version)

          print()
          print("TikTokLive:")
          print("  path:", getattr(TikTokLive, "__file__", "unknown"))
          print(
              "  version:",
              getattr(
                  TikTokLive,
                  "__version__",
                  "unknown"
              )
          )

          print()
          print("EulerApiSdk:")
          print("  path:", getattr(EulerApiSdk, "__file__", "unknown"))
          print(
              "  version:",
              getattr(
                  EulerApiSdk,
                  "__version__",
                  "unknown"
              )
          )

          print("=" * 70)
          PY


      # ============================================================
      # TEST CORRECT EULER MODULE
      # ============================================================

      - name: Test Euler fetch_webcast_url
        run: |
          python - <<'PY'
          import inspect

          print("=" * 70)
          print("EULER fetch_webcast_url TEST")
          print("=" * 70)

          from EulerApiSdk.api.tik_tok_live_rooms import (
              fetch_webcast_url
          )

          print()
          print("IMPORT: OK")

          print()
          print("FUNCTION:")
          print(fetch_webcast_url)

          print()
          print("MODULE:")
          print(
              getattr(
                  fetch_webcast_url,
                  "__module__",
                  "unknown"
              )
          )

          print()
          print("SIGNATURE:")

          try:
              print(
                  inspect.signature(
                      fetch_webcast_url
                  )
              )
          except Exception as e:
              print(
                  "signature error:",
                  type(e).__name__,
                  str(e)
              )

          print()
          print("SOURCE:")

          try:
              print(
                  inspect.getsource(
                      fetch_webcast_url
                  )
              )
          except Exception as e:
              print(
                  "source unavailable:",
                  type(e).__name__,
                  str(e)
              )

          print()
          print("=" * 70)
          print("EULER TEST SUCCESS")
          print("=" * 70)
          PY


      # ============================================================
      # TIKTOKLIVE TEST
      # ============================================================

      - name: Test TikTokLive
        run: |
          python - <<'PY'
          import inspect

          print("=" * 70)
          print("TIKTOKLIVE TEST")
          print("=" * 70)

          from TikTokLive import TikTokLiveClient

          print()
          print("TikTokLiveClient:")
          print(TikTokLiveClient)

          print()
          print("Signature:")

          try:
              print(
                  inspect.signature(
                      TikTokLiveClient
                  )
              )
          except Exception as e:
              print(
                  "signature error:",
                  type(e).__name__,
                  str(e)
              )

          print()
          print("=" * 70)
          print("TIKTOKLIVE TEST SUCCESS")
          print("=" * 70)
          PY


      # ============================================================
      # BUILDOZER BUILD
      # ============================================================

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug


      # ============================================================
      # FIND APK
      # ============================================================

      - name: Find APK
        id: find_apk
        shell: bash
        run: |
          APK_PATH="$(find bin -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "APK bulunamadı."
            exit 1
          fi

          echo "APK bulundu:"
          echo "$APK_PATH"

          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: futbolgiftyarisi-apk
          path: ${{ steps.find_apk.outputs.path }}
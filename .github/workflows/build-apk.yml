name: Build APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:


jobs:

  build:

    name: Build Android APK

    runs-on: ubuntu-22.04

    timeout-minutes: 120

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # PYTHON 3.11
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"


      # ==========================================================
      # JAVA 17
      # ==========================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # SYSTEM PACKAGES
      # ==========================================================

      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5


      # ==========================================================
      # PIP
      # ==========================================================

      - name: Upgrade pip
        run: |

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel


      # ==========================================================
      # CYTHON
      #
      # VERY IMPORTANT:
      # Buildozer 1.5.x expects Cython 0.29.x
      # ==========================================================

      - name: Install Cython
        run: |

          python -m pip uninstall -y Cython cython || true

          python -m pip install \
            --no-cache-dir \
            --force-reinstall \
            "Cython==0.29.37"

          echo "PATH:"
          echo "$PATH"

          echo "Python:"
          python --version

          echo "Cython executable:"
          which cython || true

          echo "Cython:"
          cython --version

          echo "Python module:"
          python -m cython --version


      # ==========================================================
      # BUILDOZER + P4A
      # ==========================================================

      - name: Install Buildozer and python-for-android
        run: |

          python -m pip install \
            --no-cache-dir \
            --force-reinstall \
            "buildozer==1.5.0" \
            "python-for-android==2024.1.21"


      # ==========================================================
      # VERIFY BUILD TOOLS
      # ==========================================================

      - name: Verify Build tools
        run: |

          echo "=============================================="
          echo "PYTHON"
          echo "=============================================="

          python --version
          which python

          echo "=============================================="
          echo "PIP"
          echo "=============================================="

          python -m pip --version

          echo "=============================================="
          echo "CYTHON"
          echo "=============================================="

          which cython
          cython --version
          python -m cython --version

          echo "=============================================="
          echo "BUILDOZER"
          echo "=============================================="

          which buildozer
          buildozer --version

          echo "=============================================="
          echo "P4A"
          echo "=============================================="

          python -m pythonforandroid.toolchain --version || true

          echo "=============================================="
          echo "INSTALLED PACKAGES"
          echo "=============================================="

          python -m pip list


      # ==========================================================
      # HOST DEPENDENCIES
      #
      # TikTokLive dependencies are NOT removed.
      # ==========================================================

      - name: Install TikTokLive dependencies
        run: |

          python -m pip install \
            --no-cache-dir \
            "aiohttp>=3.9,<4" \
            "httpx>=0.26,<0.29" \
            "httpcore>=1,<2" \
            "h11>=0.14,<1" \
            "anyio>=4,<5" \
            "sniffio>=1.3,<2" \
            "certifi>=2023,<2027" \
            "idna>=3,<4" \
            "charset-normalizer>=3,<4" \
            "attrs>=23,<26" \
            "aiosignal>=1.3,<2" \
            "multidict>=6,<7" \
            "yarl>=1.9,<2" \
            "frozenlist>=1.4,<2" \
            "async-timeout>=4.0.3,<6" \
            "pyee==13.0.1" \
            "ffmpy>=0.3.0" \
            "websockets" \
            "websockets_proxy==0.1.3" \
            "betterproto==2.0.0b7" \
            "mashumaro>=3.5" \
            "protobuf>=3.19.4" \
            "protobuf3-to-dict>=0.1.5" \
            "typing-extensions>=4" \
            "EulerApiSdk==0.6.0" \
            "TikTokLive==6.6.5"


      # ==========================================================
      # TEST IMPORTS
      # ==========================================================

      - name: Test Python imports
        run: |

          python - <<'PY'

          import sys
          import importlib.metadata

          print("=" * 70)
          print("PYTHON TEST")
          print("=" * 70)

          print("Python:", sys.version)

          packages = [
              "aiohttp",
              "httpx",
              "pyee",
              "ffmpy",
              "websockets_proxy",
              "betterproto",
              "mashumaro",
              "protobuf",
              "protobuf3-to-dict",
              "EulerApiSdk",
              "TikTokLive",
          ]

          for package in packages:

              try:

                  print(
                      package,
                      "=",
                      importlib.metadata.version(package)
                  )

              except Exception as e:

                  print(
                      package,
                      "ERROR:",
                      e
                  )

          print("=" * 70)

          import aiohttp
          print("aiohttp import: OK")

          import EulerApiSdk
          print("EulerApiSdk import: OK")

          import TikTokLive
          print("TikTokLive import: OK")

          import server
          print(
              "server.TIKTOK_AVAILABLE:",
              server.TIKTOK_AVAILABLE
          )

          if not server.TIKTOK_AVAILABLE:
              raise RuntimeError(
                  "TikTokLive import server.py içinde başarısız"
              )

          app = server.create_app()

          print(
              "aiohttp application:",
              app
          )

          print("=" * 70)
          print("ALL PYTHON TESTS PASSED")
          print("=" * 70)

          PY


      # ==========================================================
      # PYTHON SYNTAX
      # ==========================================================

      - name: Check Python syntax
        run: |

          python -m py_compile main.py
          python -m py_compile server.py

          echo "Python syntax OK"


      # ==========================================================
      # CLEAN OLD BUILDOZER DATA
      # ==========================================================

      - name: Clean Buildozer
        run: |

          rm -rf .buildozer
          rm -rf bin

          rm -rf "$HOME/.buildozer"

          echo "Buildozer cache cleaned."


      # ==========================================================
      # CHECK BUILDOZER CONFIG
      # ==========================================================

      - name: Show Buildozer configuration
        run: |

          echo "=============================================="
          echo "buildozer.spec"
          echo "=============================================="

          cat buildozer.spec

          echo "=============================================="
          echo "SYSTEM"
          echo "=============================================="

          uname -a

          echo "=============================================="
          echo "JAVA"
          echo "=============================================="

          java -version

          echo "=============================================="
          echo "PYTHON"
          echo "=============================================="

          python --version

          echo "=============================================="
          echo "CYTHON"
          echo "=============================================="

          cython --version

          echo "=============================================="
          echo "BUILDOZER"
          echo "=============================================="

          buildozer --version


      # ==========================================================
      # BUILD APK
      # ==========================================================

      - name: Build APK
        env:
          P4A_RELEASE_PYTHON_VERSION: "3.11.9"
        run: |

          echo "=============================================="
          echo "STARTING ANDROID BUILD"
          echo "=============================================="

          buildozer -v android debug


      # ==========================================================
      # SEARCH APK
      # ==========================================================

      - name: Find APK
        if: always()
        run: |

          echo "=============================================="
          echo "APK / AAB FILES"
          echo "=============================================="

          find . \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print


      # ==========================================================
      # UPLOAD APK
      # ==========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: futbol-gift-yarisi-apk
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
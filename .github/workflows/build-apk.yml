name: Build APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # PYTHON 3.11
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"


      # ==========================================================
      # JAVA 17
      # ==========================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # SYSTEM PACKAGES
      # ==========================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5


      # ==========================================================
      # PIP
      # ==========================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel


      # ==========================================================
      # CYTHON
      # ==========================================================

      - name: Install Cython
        run: |
          python -m pip uninstall -y Cython cython || true

          python -m pip install \
            --no-cache-dir \
            --force-reinstall \
            "Cython==0.29.37"

          echo "PATH:"
          echo "$PATH"

          echo "Python:"
          python --version

          echo "Cython executable:"
          which cython || true

          echo "Cython:"
          cython --version

          echo "Python module:"
          python -m cython --version


      # ==========================================================
      # BUILDOZER + P4A
      # ==========================================================

      - name: Install Buildozer and python-for-android
        run: |
          python -m pip install \
            --no-cache-dir \
            --force-reinstall \
            "buildozer==1.5.0" \
            "python-for-android==2024.1.21"


      # ==========================================================
      # VERIFY BUILD TOOLS
      # ==========================================================

      - name: Verify Build tools
        run: |
          echo "=============================================="
          echo "PYTHON"
          echo "=============================================="

          python --version
          which python

          echo "=============================================="
          echo "PIP"
          echo "=============================================="

          python -m pip --version

          echo "=============================================="
          echo "CYTHON"
          echo "=============================================="

          which cython
          cython --version
          python -m cython --version

          echo "=============================================="
          echo "BUILDOZER"
          echo "=============================================="

          which buildozer
          buildozer --version

          echo "=============================================="
          echo "P4A"
          echo "=============================================="

          python -m pythonforandroid.toolchain --version || true

          echo "=============================================="
          echo "INSTALLED PACKAGES"
          echo "=============================================="

          python -m pip list


      # ==========================================================
      # HOST DEPENDENCIES
      # ==========================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "aiohttp" \
            "httpx" \
            "httpcore" \
            "h11" \
            "anyio" \
            "sniffio" \
            "certifi" \
            "idna" \
            "charset-normalizer" \
            "attrs" \
            "aiosignal" \
            "multidict" \
            "yarl" \
            "frozenlist" \
            "async-timeout" \
            "pyee==13.0.1" \
            "ffmpy" \
            "websockets" \
            "websockets_proxy==0.1.3" \
            "betterproto==2.0.0b7" \
            "mashumaro" \
            "protobuf" \
            "protobuf3-to-dict" \
            "typing-extensions" \
            "TikTokLive-fix" \
            "TikTokLiveProto" \
            "pyjnius" \
            "betterproto2==0.9.0" \
            "requests" \
            "websocket-client" \
            "pydantic==2.12.2" \
            "pydantic-core==2.41.4" \
            "annotated-types" \
            "typing-inspection" \
            "python-socks" \
            "python-dateutil" \
            "grpclib" \
            "h2"

      # ==========================================================
      # TEST IMPORTS
      # ==========================================================

      - name: Test Python imports
        run: |
          python - <<'PY'

          import sys
          import importlib.metadata

          print("=" * 70)
          print("PYTHON TEST")
          print("=" * 70)

          print("Python:", sys.version)

          packages = [
              "aiohttp",
              "httpx",
              "pyee",
              "ffmpy",
              "websockets_proxy",
              "betterproto",
              "mashumaro",
              "protobuf",
              "protobuf3-to-dict",
              "TikTokLive-fix",
          ]

          for package in packages:
              try:
                  print(
                      package,
                      "=",
                      importlib.metadata.version(package)
                  )
              except Exception as e:
                  print(
                      package,
                      "ERROR:",
                      e
                  )

          print("=" * 70)

          import aiohttp
          print("aiohttp import: OK")
          import TikTokLive
          print("TikTokLive-fix import: OK")

          import server

          print(
              "server.TIKTOK_AVAILABLE:",
              server.TIKTOK_AVAILABLE
          )

          if not server.TIKTOK_AVAILABLE:
              raise RuntimeError(
                  "TikTokLive import server.py içinde başarısız"
              )

          app = server.create_app()

          print(
              "aiohttp application:",
              app
          )

          print("=" * 70)
          print("ALL PYTHON TESTS PASSED")
          print("=" * 70)

          PY


      # ==========================================================
      # PYTHON SYNTAX
      # ==========================================================

      - name: Check Python syntax
        run: |
          python -m py_compile main.py
          python -m py_compile server.py

          echo "Python syntax OK"


      # ==========================================================
      # CLEAN BUILDOZER DATA
      # ==========================================================

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -rf "$HOME/.buildozer"

          echo "Buildozer cache cleaned."


      # ==========================================================
      # CHECK BUILDOZER CONFIG
      # ==========================================================

      - name: Show Buildozer configuration
        run: |
          echo "=============================================="
          echo "buildozer.spec"
          echo "=============================================="

          cat buildozer.spec

          echo "=============================================="
          echo "SYSTEM"
          echo "=============================================="

          uname -a

          echo "=============================================="
          echo "JAVA"
          echo "=============================================="

          java -version

          echo "=============================================="
          echo "PYTHON"
          echo "=============================================="

          python --version

          echo "=============================================="
          echo "CYTHON"
          echo "=============================================="

          cython --version

          echo "=============================================="
          echo "BUILDOZER"
          echo "=============================================="

          buildozer --version


      # ==========================================================
      # BUILD APK
      # ==========================================================

      - name: Build APK
        env:
          P4A_RELEASE_PYTHON_VERSION: "3.11.9"
        run: |
          echo "=============================================="
          echo "STARTING ANDROID BUILD"
          echo "=============================================="

          buildozer -v android debug


      # ==========================================================
      # SEARCH APK
      # ==========================================================

      - name: Find APK
        if: always()
        run: |
          echo "=============================================="
          echo "APK / AAB FILES"
          echo "=============================================="

          find . \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print


      # ==========================================================
      # UPLOAD APK
      # ==========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: futbol-gift-yarisi-apk
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
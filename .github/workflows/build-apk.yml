name: Build APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:


jobs:

  build:

    name: Build Android APK

    runs-on: ubuntu-22.04

    timeout-minutes: 120

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"


      # ======================================================
      # JAVA
      # ======================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ======================================================
      # SYSTEM DEPENDENCIES
      # ======================================================

      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev


      # ======================================================
      # PYTHON BUILD TOOLS
      # ======================================================

                  - name: Install build tools
        run: |

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          pip install --no-cache-dir \
            "Cython==0.29.37" \
            "buildozer==1.5.0" \
            "python-for-android==2024.1.21"


      - name: Verify build tools
        run: |

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version

          echo "========================================"
          echo "CYTHON"
          echo "========================================"

          cython --version

          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer --version

          echo "========================================"
          echo "P4A"
          echo "========================================"

          python -m pythonforandroid.toolchain --version || true

      # ======================================================
      # HOST TEST DEPENDENCIES
      # ======================================================

      - name: Install host dependencies
        run: |

          pip install --no-cache-dir \
            "aiohttp>=3.9,<4" \
            "TikTokLive==6.6.5" \
            "EulerApiSdk==0.0.3" \
            "httpx>=0.26,<0.29" \
            "pyee==13.0.1" \
            "ffmpy>=0.3.0" \
            "websockets_proxy==0.1.3" \
            "betterproto==2.0.0b7" \
            "async-timeout>=4.0.3" \
            "mashumaro>=3.5" \
            "protobuf3-to-dict>=0.1.5" \
            "protobuf>=3.19.4"




    
      # ======================================================
      # VERIFY
      # ======================================================

      - name: Verify Python environment
        run: |

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version

          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer --version

          echo "========================================"
          echo "P4A"
          echo "========================================"

          python -m pythonforandroid.toolchain --version || true

          echo "========================================"
          echo "PACKAGES"
          echo "========================================"

          python - <<'PY'

          import importlib.metadata

          packages = [
              "aiohttp",
              "TikTokLive",
              "EulerApiSdk",
              "httpx",
              "pyee",
              "ffmpy",
              "websockets_proxy",
              "betterproto",
              "async-timeout",
              "mashumaro",
              "protobuf3-to-dict",
              "protobuf",
          ]

          for package in packages:

              try:

                  print(
                      package,
                      "=",
                      importlib.metadata.version(package)
                  )

              except Exception as e:

                  print(
                      package,
                      "=",
                      "ERROR",
                      e
                  )

          PY


      # ======================================================
      # TEST SERVER
      # ======================================================

      - name: Test server
        run: |

          python - <<'PY'

          import server

          print("=" * 70)
          print("SERVER TEST")
          print("=" * 70)

          print(
              "TikTokLive available:",
              server.TIKTOK_AVAILABLE
          )

          if not server.TIKTOK_AVAILABLE:

              raise SystemExit(
                  "TikTokLive import failed"
              )

          app = server.create_app()

          print(
              "Aiohttp app:",
              app
          )

          print("=" * 70)
          print("SERVER OK")
          print("=" * 70)

          PY


      # ======================================================
      # PYTHON SYNTAX
      # ======================================================

      - name: Test Python files
        run: |

          python -m py_compile main.py

          python -m py_compile server.py

          echo "Python syntax OK"


      # ======================================================
      # CLEAN BUILDOZER
      # ======================================================

      - name: Clean Buildozer
        run: |

          rm -rf .buildozer

          rm -rf bin

          echo "Build cache cleaned"


      # ======================================================
      # SHOW CONFIG
      # ======================================================

      - name: Show configuration
        run: |

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          cat buildozer.spec

          echo "========================================"
          echo "ENVIRONMENT"
          echo "========================================"

          python --version

          java -version

          buildozer --version


      # ======================================================
      # BUILD
      # ======================================================

      - name: Build APK
        run: |

          buildozer -v android debug


      # ======================================================
      # FIND APK
      # ======================================================

      - name: Find APK
        run: |

          echo "========================================"
          echo "APK FILES"
          echo "========================================"

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print


      # ======================================================
      # UPLOAD
      # ======================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: futbol-gift-yarisi-apk

          path: |
            bin/*.apk
            bin/*.aab

          if-no-files-found: error
name: Build APK

on:

  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    name: Build Android APK

    runs-on: ubuntu-22.04

    timeout-minutes: 90


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ======================================================
      # JAVA
      # ======================================================

      - name: Setup Java
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: "17"


      # ======================================================
      # SYSTEM PACKAGES
      # ======================================================

      - name: Install system packages
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5


      # ======================================================
      # BUILD TOOLS
      # ======================================================

      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer \
            cython==0.29.36 \
            virtualenv


      # ======================================================
      # INSTALL EXACT PYTHON VERSIONS
      # ======================================================

      - name: Install Python dependencies
        run: |

          python -m pip install \
            "TikTokLive==6.6.5" \
            "EulerApiSdk==0.0.3"


      # ======================================================
      # VERIFY EULER
      # ======================================================

      - name: Verify EulerApiSdk
        run: |

          python - <<'PY'

          import importlib.metadata as metadata
          import inspect

          from EulerApiSdk.api.tik_tok_live import sign_webcast_url

          from EulerApiSdk.models.sign_tik_tok_url_body import (
              SignTikTokUrlBody
          )

          print("=" * 70)
          print("EULER SDK")
          print("=" * 70)

          print(
              "Version:",
              metadata.version("EulerApiSdk")
          )

          print(
              "sign_webcast_url:",
              sign_webcast_url
          )

          print(
              "asyncio:",
              inspect.signature(
                  sign_webcast_url.asyncio
              )
          )

          print(
              "sync:",
              inspect.signature(
                  sign_webcast_url.sync
              )
          )

          print(
              "Body:",
              inspect.signature(
                  SignTikTokUrlBody
              )
          )

          print("=" * 70)
          print("EULER 0.0.3 OK")
          print("=" * 70)

          PY


      # ======================================================
      # VERIFY TIKTOKLIVE
      # ======================================================

      - name: Verify TikTokLive
        run: |

          python - <<'PY'

          import importlib.metadata as metadata
          import inspect

          from TikTokLive import TikTokLiveClient

          from TikTokLive.events import (
              ConnectEvent,
              DisconnectEvent,
              GiftEvent,
              LikeEvent,
              FollowEvent,
              ShareEvent,
              CommentEvent,
          )

          print("=" * 70)
          print("TIKTOKLIVE")
          print("=" * 70)

          print(
              "Version:",
              metadata.version("TikTokLive")
          )

          print(
              "Client:",
              TikTokLiveClient
          )

          print(
              "Client signature:",
              inspect.signature(
                  TikTokLiveClient
              )
          )

          print("ConnectEvent:", ConnectEvent)
          print("DisconnectEvent:", DisconnectEvent)
          print("GiftEvent:", GiftEvent)
          print("LikeEvent:", LikeEvent)
          print("FollowEvent:", FollowEvent)
          print("ShareEvent:", ShareEvent)
          print("CommentEvent:", CommentEvent)

          print("=" * 70)
          print("TIKTOKLIVE 6.6.5 OK")
          print("=" * 70)

          PY


      # ======================================================
      # VERIFY SERVER
      # ======================================================

      - name: Test server
        run: |

          python - <<'PY'

          import server

          print("=" * 70)
          print("SERVER TEST")
          print("=" * 70)

          print(
              "TikTokLive available:",
              server.TIKTOK_AVAILABLE
          )

          if not server.TIKTOK_AVAILABLE:
              raise SystemExit(
                  "TikTokLive import failed"
              )

          app = server.create_app()

          print(
              "Aiohttp app:",
              app
          )

          print("=" * 70)
          print("SERVER OK")
          print("=" * 70)

          PY


      # ======================================================
      # BUILDOZER CACHE
      # ======================================================

      - name: Cache Buildozer
        uses: actions/cache@v4

        with:
          path: |
            .buildozer
            ~/.buildozer

          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

          restore-keys: |
            ${{ runner.os }}-buildozer-


      # ======================================================
      # BUILD APK
      # ======================================================

      - name: Build APK
        run: |

          yes | buildozer android debug


      # ======================================================
      # FIND APK
      # ======================================================

      - name: Find APK
        id: apk
        shell: bash

        run: |

          APK_PATH="$(find bin -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then

            echo "APK tapılmadı."

            echo "bin contents:"

            find bin -type f || true

            exit 1

          fi

          echo "APK tapıldı:"
          echo "$APK_PATH"

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"


      # ======================================================
      # UPLOAD APK
      # ======================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: futbolgiftyarisi-apk

          path: ${{ steps.apk.outputs.apk_path }}
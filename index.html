.field{position:absolute;left:0;right:0;top:20%;bottom:11%;
background:
  repeating-linear-gradient(90deg, #2d7a32 0px, #2d7a32 38px, #348a38 38px, #348a38 76px),
  linear-gradient(180deg, #1e5c22 0%, #2d7a32 40%, #2d7a32 60%, #1e5c22 100%);
box-shadow:inset 0 20px 45px #0003;
overflow:hidden}
.field::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0001,#fff0000a 50%,#0002);pointer-events:none}
.lane{position:absolute;left:0;right:8%;height:10.1%;border-bottom:2px dashed #fffdd0;z-index:2}
.finish{position:absolute;z-index:5;right:7%;top:0;bottom:0;width:28px;background:repeating-conic-gradient(#fff 0 25%,#1c241d 0 50%) 50%/28px 28px;border-left:3px solid #fff;border-right:3px solid #fff;box-shadow:0 0 10px #0008}
.lap{position:absolute;z-index:30;left:1.8%;top:1.2%;width:12%;min-width:100px;background:#071014ed;border:1px solid #ffffff2b;border-radius:10px;text-align:center;padding:8px 4px;box-shadow:0 8px 22px #0007}
.lap .a{font-size:24px;font-weight:1000}.lap .b{font-size:29px;color:#ffd849;font-weight:1000}
.title{position:absolute;z-index:30;left:25.5%;top:0.8%;width:42%;height:8.5%;background:#07131de9;border-radius:0 0 10px 10px;display:flex;align-items:center;justify-content:center;text-align:center;gap:14px;box-shadow:0 8px 24px #0006}
.title .main{font-size:clamp(18px,3vw,31px);font-weight:1000;letter-spacing:.5px}.title .sub{font-size:14px;color:#ddd;margin-top:3px}
.trophy{font-size:clamp(28px,4vw,45px)}
.support{position:absolute;z-index:30;right:5.5%;top:1.2%;width:26%;min-width:235px;background:#07100fea;border:1px solid #ffffff2b;border-radius:9px;padding:7px 10px;box-shadow:0 8px 24px #0007}
.support h3{margin:0 0 5px;text-align:center;background:#111a1ae8;border:1px solid #ffffff18;border-radius:6px;padding:5px;font-size:14px}
.row{display:flex;justify-content:space-between;font-size:12px;font-weight:800;padding:3px 2px}
.sound{position:absolute;z-index:40;right:1.7%;top:1.4%;width:44px;height:42px;border-radius:9px;border:1px solid #ffffff2b;background:#071014ed;color:white;font-size:21px}
.players{position:absolute;z-index:10;inset:20% 0 11% 0}
.player{position:absolute;left:0;right:0;height:10%;z-index:10;overflow:visible}
.info{position:absolute;left:13%;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:10px;z-index:12}
.rank{font-size:29px;font-weight:1000;width:24px}.flag{font-size:19px}.score{margin-left:6px;background:#000a;padding:1px 6px;border-radius:8px;font-size:11px;color:#ffd84d;font-weight:900}.name{font-size:16px;font-weight:1000;white-space:nowrap;text-shadow:0 2px 3px #000}
.runner{position:absolute;top:50%;left:8%;width:70px;height:100px;transform:translateY(-50%);z-index:15;will-change:left;pointer-events:none;filter:drop-shadow(0 4px 6px #000a)}
.runner img{width:100%;height:100%;object-fit:contain;display:block;background:transparent!important;filter:drop-shadow(0 3px 5px #000a)}.runner.running img{
  animation: runBob .18s infinite alternate ease-in-out;
  transform-origin: center bottom;
}
@keyframes runBob{
  0%{transform:translateY(0) rotate(-2deg) scaleX(1) scaleY(1)}
  50%{transform:translateY(-6px) rotate(1deg) scaleX(1.03) scaleY(.97)}
  100%{transform:translateY(-2px) rotate(2deg) scaleX(.98) scaleY(1.02)}
}
.runner.running{
  transition: left 0.05s linear;
}
.boost{position:absolute;left:50%;top:-18px;transform:translateX(-50%);color:#ffe65d;font-weight:1000;font-size:10px;opacity:0;white-space:nowrap}.boost.on{animation:boost .8s ease}@keyframes boost{0%{opacity:0;transform:translate(-50%,8px)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-25px)}}
.gifts{position:absolute;z-index:35;left:2.2%;top:20.2%;bottom:11.8%;width:8.8%;display:flex;flex-direction:column;justify-content:space-between}
.gift{position:relative;width:100%;height:8.8%;min-height:48px;border-radius:8px;background:#102613e8;border:1px solid #ffffff2a;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 16px #0008;overflow:hidden}
.gift img:not(.gift-avatar){width:100%;height:100%;object-fit:cover}.gift span{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:10px;font-weight:900;text-shadow:0 2px 3px #000}
.gift.active{outline:2px solid #ffd84b}
.bottom{position:absolute;z-index:30;left:1.7%;right:1.7%;bottom:1.3%;height:10%;display:grid;grid-template-columns:31% 34% 31%;gap:3.5%}
.panel{background:#07100eea;border:1px solid #ffffff2a;border-radius:9px;padding:7px 12px;box-shadow:0 8px 24px #0008}.panel h3{margin:0 0 5px;text-align:center;font-size:12px;color:#bbb}.how{font-size:9px;line-height:1.5}
.controls{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.start,.reset{width:70%;min-width:190px;border:0;border-radius:11px;padding:10px;font-weight:1000;cursor:pointer}.start{background:#2bbb35;color:#fff;font-size:19px;box-shadow:0 4px 0 #16851f}.reset{background:#686868;color:#ddd;font-size:14px}
.info2{display:grid;grid-template-columns:1fr auto;gap:5px;font-size:10px}
.result{position:absolute;z-index:100;inset:0;display:none;place-items:center;background:#0009}.result.show{display:grid}.box{width:min(88%,380px);background:#07160f;border:1px solid #ffffff35;border-radius:18px;padding:22px;text-align:center}.cup{font-size:55px}.win{font-size:20px;font-weight:1000}.pod{font-size:12px;line-height:1.7;color:#ddd}.again{margin-top:10px;border:0;border-radius:10px;padding:10px 18px;background:#ffd84d;font-weight:1000}
@media(max-width:700px){.support{min-width:180px}.score{margin-left:6px;background:#000a;padding:1px 6px;border-radius:8px;font-size:11px;color:#ffd84d;font-weight:900}.name{font-size:10px}.info{left:12%}.runner{width:74px;height:78px}.gift span{font-size:8px}.panel{padding:5px}.how{font-size:7px}.start{min-width:130px;font-size:14px}.reset{min-width:130px;font-size:11px}}

function pushGiftFeed(username, giftName){
  try{
    var box = document.getElementById('gift-feed');
    if(!box) return;
    var u = String(username||'Someone').trim() || 'Someone';
    var g = String(giftName||'Gift').trim() || 'Gift';
    var line = document.createElement('div');
    line.className = 'gline';
    line.innerHTML = '<b>'+u.replace(/</g,'&lt;')+'</b> sent <b>'+g.replace(/</g,'&lt;')+'</b>';
    box.appendChild(line);
    // only one line at a time at top
    while(box.children.length > 1) box.removeChild(box.firstChild);

      try{
        line.classList.add('hide');
        setTimeout(function(){ if(line.parentNode) line.parentNode.removeChild(line); }, 280);
      }catch(e){}
    }, 1000);
  }catch(e){}

function sendGift(playerId){
  // local test: +10 points
  scores[playerId]=(scores[playerId]||0)+1;
  playGiftSound();
  speakPlayer(playerId);
  racers[playerId].score=scores[playerId];
  racers[playerId].boost=Math.min(1.2, (racers[playerId].boost||0)+0.4);
  const b=document.getElementById('b'+playerId);

  const gsc=document.getElementById('gsc'+playerId);
  if(gsc) gsc.textContent=scores[playerId];
  updatePositionsFromScores();
}

/** Core rule: higher score = further ahead. Others 1 step behind in rank order. */
function updatePositionsFromScores(){
  const n = racers.length;
  // rank by score desc
  const order = [...racers].sort((a,b)=> (scores[b.i]-scores[a.i]) || (a.i-b.i));
  const maxScore = Math.max(0, ...scores);
  const step = 100 / n;

  order.forEach((r, rank)=>{
    // vertical: leader at top (rank 0)
    const row = r.elRow || document.getElementById('r'+r.i)?.parentElement;
    if(row){
      row.style.top = (rank * step) + '%';
      row.style.transition = 'top 0.45s ease';
      r.elRow = row;
    }
    // move gift flag column order too
    const giftEl = gifts.children[r.i];
    // we'll reorder gifts container by rank below

    // horizontal position by rank + score
    let tx;
    if(maxScore > 0){
      const rankX = MAX_X - rank * GAP;
      const scoreX = MIN_X + (scores[r.i]/maxScore) * (MAX_X - MIN_X);
      tx = rankX * 0.65 + scoreX * 0.35;
    } else {
      tx = MIN_X;
    }
    tx = Math.max(MIN_X, Math.min(MAX_X, tx));
    r.targetX = tx;
    r.score = scores[r.i];
    const sc = document.getElementById('sc'+r.i);
    // Adı həmişə playerNames-dən yaz (gift-dən sonra dəyişir)
    try{
      if(playerNames && playerNames[r.i]){
        const row = r.elRow || (sc && sc.closest('.player'));
        if(row){
          const nameEl = row.querySelector('.name');
          if(nameEl && nameEl.textContent !== playerNames[r.i]) nameEl.textContent = playerNames[r.i];
        }
      }
    }catch(e){}

    if(sc) sc.textContent = scores[r.i];
    const gsc = document.getElementById('gsc'+r.i);
    if(gsc) gsc.textContent = String(scores[r.i]|0);
    // bayraq altında ad qalmasın
    try{ document.querySelectorAll('.gift-uname').forEach(function(el){ el.remove(); }); }catch(e){}
  });

  // reorder gift flags to match ranking (top = leader)
  if(gifts){
    const map = {};
    Array.from(gifts.children).forEach(el=>{
      if(el && el.dataset && el.dataset.pid != null) map[el.dataset.pid] = el;
    });
    order.forEach(r=>{
      const el = map[String(r.i)];
      if(el) gifts.appendChild(el); // moves to end in rank order
    });
  }
}

function tick(){
  racers.forEach((r,i)=>{
    // smooth move toward target
    const dx = r.targetX - r.x;
    r.x += dx * 0.08;
    if(r.boost>0){
      r.boost = Math.max(0, r.boost - 0.012);
      r.x += 0.002 * r.boost; // tiny pulse
      r.el && r.el.classList.add('running');
    }
    const el=document.getElementById('r'+i);
    if(el){
      el.style.left=(r.x*100)+'%';
      el.classList.add('running'); // always look like running
    }
  });
  raf=requestAnimationFrame(tick);
}

function startRace(){
  // in score mode "start" just ensures animation + resets optional
  running=true;
  document.getElementById('status').textContent='Live';
  document.querySelectorAll('.runner').forEach(x=>x.classList.add('running'));
  if(!raf) raf=requestAnimationFrame(tick);
}

function resetAll(){
  scores=new Array(P.length).fill(0);
  racers.forEach(r=>{r.x=MIN_X;r.targetX=MIN_X;r.boost=0;r.score=0;});
  updatePositionsFromScores();
  document.getElementById('status').textContent='Ready';
  document.getElementById('boostState').textContent='—';
  result.classList.remove('show');
}

// WebSocket support (optional – works without server too)
let ws=null;
function connectWS(){
  try{
    const proto=location.protocol==='https:'?'wss':'ws';
    window.ws=ws=new WebSocket(proto+'://'+location.host+'/ws');
    ws.onmessage=(ev)=>{
      try{
        const data=JSON.parse(ev.data);
        if(data.type==='gift' || data.type==='boost'){
          try{
            if(data.type==='gift' || data.sound) playGiftSound();
            if(data.type==='gift' && data.player_id!=null) speakPlayer(data.player_id|0);
            var pid = (data.player_id|0);
            if(data.scores) scores = data.scores.slice();
            else if(data.points) scores[pid] = (scores[pid]|0) + (data.points|0);

            if(data.type==='gift'){
              var nn = String(data.player_name || data.username || '').trim();
              var gName = String(data.gift_name || data.giftName || 'Gift').trim();
              var avUrl = (data.avatar && String(data.avatar).indexOf('http')===0) ? String(data.avatar) : '';

              // Gift feed (top, under TOP SUPPORTERS)
              if(nn) pushGiftFeed(nn, gName);

              // Player name = supporter name (lane only, NOT under flag)
              if(nn){
                if(playerNames) playerNames[pid] = nn;
                if(P[pid]) P[pid].name = nn;
                document.querySelectorAll('.name[data-pid="'+pid+'"]').forEach(function(el){ el.textContent = nn; });
                var scEl = document.getElementById('sc'+pid);
                if(scEl && scEl.parentElement){
                  var ne = scEl.parentElement.querySelector('.name');
                  if(ne) ne.textContent = nn;
                }
                if(racers[pid] && racers[pid].elRow){
                  var ne2 = racers[pid].elRow.querySelector('.name');
                  if(ne2) ne2.textContent = nn;
                }
                // bayraq altında AD olmasın
                try{
                  document.querySelectorAll('.gift-uname').forEach(function(el){ el.remove(); });
                  var gsc = document.getElementById('gsc'+pid);
                  if(gsc && isNaN(Number(gsc.textContent))) gsc.textContent = String(scores[pid]|0);
                }catch(e){}
              }

              // Avatar above flag (with spacing via CSS)
              if(avUrl){
                if(playerAvatars) playerAvatars[pid] = avUrl;
                var av = document.getElementById('av'+pid);
                if(av){
                  av.src = avUrl;
                  av.classList.add('show');
                  av.style.setProperty('display','block','important');
                  av.onerror = function(){ this.style.display='none'; };
                }
              }
            }

            if(racers[pid]){
              racers[pid].boost = Math.min(1.5, (racers[pid].boost||0)+(data.boost||0.3));
              var b = document.getElementById('b'+pid);
              if(b){ b.classList.remove('on'); void b.offsetWidth; b.classList.add('on'); }
            }
            updatePositionsFromScores();
            checkWinner();
          }catch(err){ console.log('[UI] gift err', err); }
        } else if(data.type==='scores' && data.scores){
          scores=data.scores.slice();
          updatePositionsFromScores();
        } else if(data.type==='init' && data.scores){
          scores=data.scores.slice();
          updatePositionsFromScores();
        
        } else if(data.type==='top_supporters' && data.list){
          const rows=document.querySelectorAll('.support .row');
          for(let i=0;i<3;i++){
            if(!rows[i]) continue;
            if(data.list[i]) rows[i].innerHTML='<span>'+(i+1)+'. '+data.list[i].username+'</span><span>'+data.list[i].coins+'</span>';
            else rows[i].innerHTML='<span>'+(i+1)+'. —</span><span>0</span>';
          }

        } else if(data.type==='api_key_result'){
          if(window.__onApiKeyResult) window.__onApiKeyResult(data);
        } else if(data.type==='status'){
          if(window.__onTikTokStatus) window.__onTikTokStatus(data);
          const st=document.getElementById('status');
          if(st) st.textContent=data.message||st.textContent;
        }
      }catch(e){}
    };
    ws.onopen=function(){ console.log('WS connected'); window.__wsReady=true; };
    ws.onerror=function(e){ console.log('WS error', e); };
    ws.onclose=function(){ window.__wsReady=false; setTimeout(connectWS,2500); };
  }catch(e){}
}

// ===== LOGIN FLOW (API KEY + USERNAME) =====
(function(){
  const screen = document.getElementById('login-screen');
  const apiInput = document.getElementById('euler-api-key');
  const checkBtn = document.getElementById('check-api-btn');
  const stepApi = document.getElementById('step-api');
  const stepUser = document.getElementById('step-user');
  const subtitle = document.getElementById('login-subtitle');
  const input = document.getElementById('tiktok-user');
  const btn = document.getElementById('start-game-btn');
  const skip = document.getElementById('skip-btn');
  const st = document.getElementById('login-status');
  if(!screen) return;

  window.__savedApiKey = '';

  function setStatus(msg, ok){
    if(!st) return;
    st.textContent = msg || '';
    st.style.color = ok ? '#7fff7f' : '#ff6b6b';
  }

  function enterGame(){
    try{
      screen.style.opacity = '0';
      screen.style.transition = 'opacity .3s';
      setTimeout(function(){
        screen.style.display = 'none';
        if(typeof startRace==='function') startRace();
      }, 280);
    }catch(e){
      if(screen) screen.style.display = 'none';
      if(typeof startRace==='function') startRace();
    }
  }

  // API key result from server
  window.__onApiKeyResult = function(data){
    if(data && data.ok){
      setStatus(data.message || 'API key qəbul olundu', true);
      if(stepApi) stepApi.style.display = 'none';
      if(stepUser) stepUser.style.display = 'block';
      if(subtitle) subtitle.textContent = '2) TikTok Live username daxil et';
      if(input) setTimeout(function(){ input.focus(); }, 150);
    } else {
      setStatus((data && data.message) || 'API key yanlışdır', false);
    }
  };

  function sendApiKey(apiKey){
    try{
      if(window.ws && window.ws.readyState===1){
        window.ws.send(JSON.stringify({type:'set_api_key', api_key: apiKey}));
        return true;
      }
    }catch(e){}
    return false;
  }

  if(checkBtn) checkBtn.onclick = function(){
    const key = (apiInput && apiInput.value || '').trim();
    if(!key){
      setStatus('API key yazın', false);
      if(apiInput) apiInput.focus();
      return;
    }
    window.__savedApiKey = key;
    setStatus('API key yoxlanılır...', true);
    if(!sendApiKey(key)){
      var tries=0;
      var iv=setInterval(function(){
        tries++;
        if(sendApiKey(key) || tries>40){
          clearInterval(iv);
          if(tries>40) setStatus('Serverə qoşulmadı. python server.py işləyir?', false);
        }
      }, 250);
    }
  };

  if(apiInput){
    apiInput.addEventListener('keydown', function(e){
      if(e.key==='Enter') checkBtn && checkBtn.click();
    });
    setTimeout(function(){ apiInput.focus(); }, 200);
  }

  function startWithUser(username){
    username = (username||'').trim().replace(/^@/,'');
    window.TIKTOK_USERNAME = username;

    // Test mode
    if(!username){
      setStatus('Test rejimi...', true);
      enterGame();
      try{
        if(window.ws && window.ws.readyState===1){
          window.ws.send(JSON.stringify({type:'set_user', username:'', api_key: window.__savedApiKey||''}));
        }
      }catch(e){}
      return;
    }

    setStatus('LIVE yoxlanılır: @'+username+' ...', true);
    window.__enterGameOnce = function(){
      window.__enterGameOnce = null;
      setStatus('LIVE qoşuldu!', true);
      enterGame();
    };
    window.__loginFailOnce = function(msg){
      window.__loginFailOnce = null;
      window.__enterGameOnce = null;
      setStatus(msg || 'LIVE deyil — giriş yoxdur', false);
    };

    function sendUser(){
      try{
        if(window.ws && window.ws.readyState===1){
          window.ws.send(JSON.stringify({
            type:'set_user',
            username: username,
            api_key: window.__savedApiKey || ''
          }));
          return true;
        }
      }catch(e){}
      return false;
    }
    if(!sendUser()){
      var tries=0;
      var iv=setInterval(function(){
        tries++;
        if(sendUser() || tries>40){
          clearInterval(iv);
          if(tries>40) setStatus('Serverə qoşulmadı. python server.py işləyir?', false);
        }
      }, 250);
    }
    setTimeout(function(){
      if(window.__enterGameOnce){
        window.__enterGameOnce = null;
        setStatus('Vaxt bitdi / LIVE tapılmadı', false);
      }
    }, 25000);
  }

  if(btn) btn.onclick = function(){
    const u = input ? input.value : '';
    if(!u || !u.trim()){
      setStatus('Username yazın və ya Test rejimini seçin', false);
      if(input) input.focus();
      return;
    }
    startWithUser(u);
  };
  if(skip) skip.onclick = function(){ startWithUser(''); };
  if(input){
    input.addEventListener('keydown', function(e){
      if(e.key==='Enter') btn && btn.click();
    });
  }
})();


// ===== PLAYER VOICE (Web Speech API) =====
const VOICE_NAMES = {
  0: "Nəriman",
  1: "Arda",
  2: "Golovin",
  3: "Çetri",
  4: "Pulisik",
  5: "Messi",
  6: "Ronaldo"
};
function speakPlayer(pid, extra){
  try{
    if(!window.speechSynthesis) return;
    const name = VOICE_NAMES[pid] || (racers[pid] && racers[pid].p && racers[pid].p.name) || "";
    if(!name) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(name + (extra ? (" " + extra) : ""));
    u.lang = "az-AZ";
    u.rate = 1.05;
    u.pitch = 1.0;
    u.volume = 1.0;
    // prefer Turkish/Azerbaijani-like voice if available
    const voices = window.speechSynthesis.getVoices();
    const pref = voices.find(v => /az|tr|türk|turk/i.test(v.lang+" "+v.name))
              || voices.find(v => /en/i.test(v.lang));
    if(pref) u.voice = pref;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
// preload voices on some browsers
if(window.speechSynthesis){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = function(){ window.speechSynthesis.getVoices(); };
}

// ===== GIFT SOUND =====
let audioCtx=null;
function playGiftSound(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const ctx=audioCtx;
    const now=ctx.currentTime;
    // coin / gift chime
    const o1=ctx.createOscillator();
    const o2=ctx.createOscillator();
    const g=ctx.createGain();
    o1.type='sine'; o2.type='triangle';
    o1.frequency.setValueAtTime(880, now);
    o1.frequency.exponentialRampToValueAtTime(1320, now+0.08);
    o2.frequency.setValueAtTime(1320, now);
    o2.frequency.exponentialRampToValueAtTime(1760, now+0.12);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.25, now+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now+0.28);
    o1.connect(g); o2.connect(g); g.connect(ctx.destination);
    o1.start(now); o2.start(now);
    o1.stop(now+0.3); o2.stop(now+0.3);
  }catch(e){}
}

    var msg = data.message || '';
    var bad = data.error || /LIVE deyil|not live|yoxlama xətası|Qoşulma xətası|Username boş/i.test(msg);
    if(bad && window.__loginFailOnce){
      window.__loginFailOnce(msg || 'LIVE deyil — giriş yoxdur');
    }
  }
};
